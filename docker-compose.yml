services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: aventra-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aventra_db
      MYSQL_USER: aventra_user
      MYSQL_PASSWORD: aventra_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - aventra-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PHP Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aventra-backend
    restart: unless-stopped
    ports:
      - "5500:80"
    environment:
      DB_HOST: mysql
      DB_USER: aventra_user
      DB_PASS: aventra_password
      DB_NAME: aventra_db
      FRONTEND_URL: http://localhost:3000
    volumes:
      - .:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aventra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/tours.php"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ../aventra-booking-system-ui
      dockerfile: Dockerfile
    container_name: aventra-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_REACT_APP_API_URL: http://localhost:5500
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aventra-network

volumes:
  mysql_data:
    driver: local

networks:
  aventra-network:
    driver: bridge
